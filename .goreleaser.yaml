# GoReleaser config — cross-compiles and publishes a GitHub Release on tag push.
# Validate locally:  goreleaser check
# Dry-run locally:   goreleaser release --snapshot --clean   (builds into ./dist)
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: megaphone-publisher
    main: .
    binary: megaphone-publisher
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # No Windows on ARM build (not needed for this audience).
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats:
      - tar.gz
    # Windows users get a .zip instead of a .tar.gz.
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # Ship the docs, license and example config alongside the binary.
    files:
      - README.md
      - LICENSE
      - megaphone.example.toml

checksum:
  name_template: checksums.txt

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    Download the archive for your machine and unpack it:

    - **Apple Silicon Mac** (M1/M2/M3/M4): `..._darwin_arm64.tar.gz`
    - **Intel Mac**: `..._darwin_amd64.tar.gz`
    - **Windows**: `..._windows_amd64.zip`
    - **Linux**: `..._linux_amd64.tar.gz`

    Then copy `megaphone.example.toml` → `megaphone.toml`, fill it in, and run
    the binary next to it. Try `-no-publish` (leaves a draft) or `-dry-run`
    (previews, no upload) first.

    ### macOS: first run

    The binaries aren't signed with an Apple Developer ID, so macOS blocks a
    **downloaded** copy the first time with "cannot verify the developer." Clear
    the quarantine flag once and it runs normally:

    ```sh
    xattr -d com.apple.quarantine megaphone-publisher
    ./megaphone-publisher
    ```

    (Or: run it, then **System Settings → Privacy & Security → Open Anyway**.)

    `checksums.txt` has SHA-256 sums for verification.

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
