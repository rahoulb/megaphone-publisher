# GoReleaser config — cross-compiles and publishes a GitHub Release on tag push.
# Validate locally:  goreleaser check
# Dry-run locally:   goreleaser release --snapshot --clean   (builds into ./dist)
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: megaphone-publisher
    main: .
    binary: megaphone-publisher
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # No Windows on ARM build (not needed for this audience).
      - goos: windows
        goarch: arm64

archives:
  - id: default
    # Always a zip, named for the platform (e.g. darwin_arm64.zip). The binary
    # INSIDE is always "megaphone-publisher" (no arch suffix) so the command is
    # the same wherever you are. Zip preserves the executable bit, so the binary
    # comes out runnable without a chmod on most extractors.
    formats:
      - zip
    name_template: "{{ .Os }}_{{ .Arch }}"
    # Ship the docs, license and example config alongside the binary.
    files:
      - README.md
      - LICENSE
      - megaphone.example.toml

checksum:
  name_template: checksums.txt

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    Download the zip for your machine and unzip it — the binary inside is always
    called `megaphone-publisher`:

    - **Apple Silicon Mac** (M1/M2/M3/M4): `darwin_arm64.zip`
    - **Intel Mac**: `darwin_amd64.zip`
    - **Windows**: `windows_amd64.zip`
    - **Linux**: `linux_amd64.zip`

    Copy `megaphone.example.toml` → `megaphone.toml`, fill it in, then run the
    binary next to it. Try `-no-publish` (leaves a draft) or `-dry-run`
    (previews, no upload) first.

    ### macOS / Linux: first run

    ```sh
    chmod +x megaphone-publisher    # if it isn't already executable
    ./megaphone-publisher
    ```

    If macOS blocks it with "cannot verify the developer" (it won't always —
    depends how you downloaded it), clear the quarantine flag once:

    ```sh
    xattr -d com.apple.quarantine megaphone-publisher
    ```

    (Or: try to run it, then **System Settings → Privacy & Security → Open
    Anyway**.)

    `checksums.txt` has SHA-256 sums for verification.

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
